[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "gnucash-bill-processor"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.28.0",
    "thefuzz>=0.20.0",
    "python-Levenshtein>=0.21.0",
    "loguru>=0.7.3",
    "python-dotenv>=1.0.0",
    "gunicorn>=25.1.0",
    "fastapi>=0.135.1",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.22",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "hypothesis>=6.0.0",
    "pytest-loguru>=0.4.0",
    "httpx>=0.27.0",
]

[tool.setuptools]
packages = ["bill_processor"]
package-dir = {"bill_processor" = "."}

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
