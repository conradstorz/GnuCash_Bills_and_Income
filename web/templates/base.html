<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}GnuCash Bill Processor{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/htmx.min.js"></script>
</head>
<body>
  <header>
    <h1>GnuCash Bill Processor</h1>
    <nav>
      <a href="/">Dashboard</a>
      <a href="/settings">Settings</a>
      <button class="btn-danger" 
              onclick="if(confirm('Close the application?')) { fetch('/shutdown', {method: 'POST'}).then(() => { document.body.innerHTML = '<div style=&quot;text-align:center; margin-top:3rem; font-size:1.2rem;&quot;>Application closed. You may close this window.</div>'; }); }">
        Close
      </button>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
