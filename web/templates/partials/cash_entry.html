<div class="card" id="cash-entry-panel">
  <h2>Cash Entry</h2>

  {% if error %}
  <div class="error-msg">{{ error }}</div>
  {% endif %}
  {% if success %}
  <div class="success-msg">{{ success }}</div>
  {% endif %}

  <!-- Client name autocomplete list (populated by /clients/search) -->
  <datalist id="client-list"
            hx-get="/clients/datalist"
            hx-trigger="load"
            hx-swap="outerHTML">
  </datalist>

  <form id="cash-form"
        hx-post="/cash/submit"
        hx-target="#cash-entry-panel"
        hx-swap="outerHTML">

    <div class="form-row">
      <label>Date
        <input type="date" name="entry_date" required value="{{ today }}">
      </label>
    </div>

    <table>
      <thead>
        <tr>
          <th>Account</th>
          <th>Memo (who paid)</th>
          <th>Amount ($)</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="cash-rows">
        {# Rows are added dynamically via HTMX #}
      </tbody>
    </table>

    <button type="button"
            hx-get="/cash/add-row"
            hx-target="#cash-rows"
            hx-swap="beforeend">
      + Add Row
    </button>

    <div class="samuse-total">
      SAMUSE Total: $<span id="samuse-total">0.00</span>
    </div>

    <hr>

    <div>
      <label>
        <input type="checkbox" id="deposit-toggle"
               onchange="document.getElementById('deposit-section').style.display = this.checked ? 'block' : 'none'">
        Bank Deposit
      </label>
    </div>

    <div id="deposit-section" style="display:none">
      <div class="form-row">
        <label>Bank Account
          <select name="deposit_account_guid">
            <option value="">-- Select bank --</option>
            {% for acct in bank_accounts %}
            <option value="{{ acct.guid }}">{{ acct.name }}</option>
            {% endfor %}
          </select>
        </label>
        <label>Amount ($)
          <input type="number" name="deposit_amount" step="0.01" placeholder="0.00">
        </label>
        <label>Date
          <input type="date" name="deposit_date" value="{{ tomorrow }}">
        </label>
      </div>
    </div>

    <div class="form-actions">
      <button type="submit">Submit All</button>
    </div>

  </form>
</div>

<script>
function updateSamuseTotal() {
  const inputs = document.querySelectorAll('#cash-rows .amount-input');
  let total = 0;
  inputs.forEach(function(input) {
    const val = parseFloat(input.value);
    if (!isNaN(val)) total += val;
  });
  document.getElementById('samuse-total').textContent = total.toFixed(2);
}
</script>
