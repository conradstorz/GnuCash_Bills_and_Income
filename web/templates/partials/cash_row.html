<tr class="cash-row">
  <td>
    <select name="account_guid" required>
      <option value="">-- Account --</option>
      {% for acct in cash_accounts %}
      <option value="{{ acct.guid }}">{{ acct.name }}</option>
      {% endfor %}
    </select>
  </td>
  <td>
    <input type="number"
           name="amount"
           step="0.01"
           placeholder="0.00"
           class="amount-input"
           oninput="updateSamuseTotal()"
           required>
  </td>
  <td>
    <button type="button"
            onclick="const row = this.closest('tr'); const memoRow = row.nextElementSibling; row.remove(); if (memoRow && memoRow.classList.contains('memo-row')) memoRow.remove(); updateSamuseTotal()">&#x2715;</button>
  </td>
</tr>
<tr class="memo-row">
  <td colspan="3">
    <input type="text"
           name="memo"
           placeholder="Memo (who paid)"
           autocomplete="off"
           list="client-list"
           style="width: 100%;"
           required>
  </td>
</tr>
